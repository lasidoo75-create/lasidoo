<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMUT55</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
color:#fff;
}

.wrapper{
max-width:420px;
margin:auto;
padding:12px;

background:
radial-gradient(circle at top,
rgba(120,0,0,.18),
transparent 35%),

linear-gradient(
180deg,
#140000 0%,
#090909 40%,
#000000 100%);
}

.header{
text-align:center;
font-size:22px;
font-weight:bold;
color:#ffffff;
margin-bottom:10px;
text-shadow:0 0 10px rgba(255,255,255,.15);
}

.photo{
margin-bottom:12px;
}

.photo img{
width:100%;
display:block;
border-radius:12px;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 0 12px rgba(120,0,0,.25),
0 0 25px rgba(0,0,0,.5);
}

/* BANNER */

.banner{
background:
linear-gradient(
180deg,
#4b0000 0%,
#2a0000 50%,
#120000 100%
);

color:#f5f5f5;
text-align:center;
padding:13px;
margin-bottom:12px;
border-radius:10px;
font-weight:bold;
font-size:16px;
line-height:1.5;

border:1px solid rgba(255,255,255,.08);

text-shadow:
0 0 5px rgba(255,255,255,.25);

box-shadow:
0 0 8px rgba(120,0,0,.25),
inset 0 1px 0 rgba(255,255,255,.08);
}

/* BUTTONS */

.buttons{
display:flex;
gap:10px;
margin-bottom:12px;
}

.buttons a{
flex:1;
text-align:center;
text-decoration:none;
padding:14px;
border-radius:10px;
font-weight:bold;
font-size:15px;
}

/* DAFTAR NYALA REDUP */

.daftar{
background:
linear-gradient(
180deg,
#7a0000 0%,
#4a0000 55%,
#220000 100%
);

color:#fff;

border:1px solid rgba(255,255,255,.12);

text-shadow:
0 0 4px rgba(255,255,255,.4);

animation:daftarGlow 1.5s infinite alternate;
}

@keyframes daftarGlow{

0%{
box-shadow:
0 0 8px rgba(255,0,0,.4),
0 0 15px rgba(255,0,0,.2);
}

100%{
box-shadow:
0 0 18px rgba(255,50,50,.9),
0 0 35px rgba(255,0,0,.6),
0 0 55px rgba(255,0,0,.4);
}
}

/* LOGIN */

.login{

background:
linear-gradient(
180deg,
#3a3a3a 0%,
#1b1b1b 50%,
#090909 100%
);

color:#fff;

border:1px solid rgba(255,255,255,.08);

box-shadow:
inset 0 1px 0 rgba(255,255,255,.08);
}

/* INFO */

.info{

background:
linear-gradient(
180deg,
#121212 0%,
#080808 100%
);

padding:14px;

border-radius:10px;

border:1px solid rgba(120,0,0,.35);

line-height:1.8;

font-size:14px;

color:#ffffff;

box-shadow:
0 0 12px rgba(120,0,0,.12);
}

/* FOOTER */

.footer{

text-align:center;

font-size:11px;

color:#8c8c8c;

margin-top:12px;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="header">
SEMUT55
</div>

<a href="https://semut55.site/account/register">

<div class="photo">

<img
src="https://s13.gifyu.com/images/bIqxI.jpg"
alt="SEMUT55"
loading="lazy">

</div>

</a>

<div class="banner">

Game Slot Pemain Terbanyak #1
<br>
Se-Asia

</div>

<div class="buttons">

<a
href="https://semut55.site/account/register"
class="daftar">

DAFTAR

</a>

<a
href="https://semut55.site/account/register"
class="login">

LOGIN

</a>

</div>

<div class="info">

Nama : SEMUT55
<br>

Payment : QRIS, BANK TRANSFER & E-Wallet
<br>

Deposit : Rp 5.000
<br>

Withdraw : Rp 50.000

</div>

<div class="footer">

Para Raja Bermain Disini

</div>

</div>

</body>
</html>
