*{box-sizing:border-box;}
body{

}
.wrapper{
    max-width:420px;
    margin:auto;
    padding:12px;

.header{
    text-align:center;
    font-size:22px;

.photo img{

.banner{

    text-align:center;
    padding:10px;
    margin:12px 0;
    border-radius:8px;
    font-weight:bold;

.buttons{

.buttons a{

    text-align:center;
    padding:13px;
    text-decoration:none;
    font-weight:bold;

.daftar{
    background:linear-gradient(#ffd700,#caa400);
    color:#000;
    animation: glow 1.6s infinite alternate;
}

@keyframes glow{
    0%{
        box-shadow:
            0 0 6px rgba(255,215,0,0.4),
            0 0 12px rgba(255,215,0,0.3);
    }
    100%{
        box-shadow:
            0 0 14px rgba(255,215,0,0.9),
            0 0 28px rgba(255,215,0,0.7),
            0 0 40px rgba(255,215,0,0.5);
    }
}

.login{
    background:linear-gradient(#222,#000);
    color:#ffd700;
    border:1px solid #ffd700;
}

/* ✅ TEKS INFO PUTIH JELAS */
.info{
    background:#0c0c0c;
    padding:14px;
    font-size:14px;
    border-radius:8px;
    border:1px solid #333;
    color:#ffffff;
    line-height:1.6;
}

.footer{
    text-align:center;
    font-size:11px;
    margin-top:10px;
    color:#aaa;
}
</style>
</head>
